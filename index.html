<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aesthetic Image Music Player</title>
  <style>
    * { box-sizing: border-box; font-family: Inter, Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #1b1f2a, #0f1115);
      color: #fff;
    }
    header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      background: rgba(15,17,21,.8);
      backdrop-filter: blur(10px);
      z-index: 5;
    }
    header h1 { font-size: 16px; opacity: .85; }
    button {
      background: #1f6aff;
      border: none;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button.secondary { background: #2a2f3f; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
      padding: 18px;
    }
    .tab {
      background: rgba(24,27,34,.9);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .tab:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 18px 45px rgba(0,0,0,.45);
    }
    .tab img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .meta {
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .title {
      font-size: 13px;
      text-align: center;
      opacity: .9;
      background: rgba(0,0,0,.25);
      padding: 6px;
      border-radius: 10px;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(5,7,12,.65);
      backdrop-filter: blur(14px);
      z-index: 20;
    }
    .viewer-card {
      max-width: 90%;
      max-height: 90%;
    }
    .viewer img {
      max-width: 100%;
      max-height: 65vh;
      border-radius: 22px;
    }
    .viewer-title { text-align: center; margin: 12px 0; }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(10px);
      z-index: 30;
    }
    .modal-card {
      background: rgba(24,27,34,.95);
      padding: 18px;
      border-radius: 20px;
      width: 320px;
      display: grid;
      gap: 12px;
    }
    .modal-card input {
      background: #1e2230;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎧 Minhas músicas visuais</h1>
    <div>
      <button id="add">+ Adicionar</button>
      <button class="secondary" id="clear">Limpar</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="viewer" id="viewer">
    <div class="viewer-card">
      <button class="secondary" id="close">Fechar</button>
      <img id="viewerImg" />
      <div class="viewer-title" id="viewerTitle"></div>
      <audio id="player" controls></audio>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <strong>Nova música</strong>
      <input id="titleInput" placeholder="Nome da música" />
      <input type="file" id="imgInput" accept="image/*" />
      <input type="file" id="audInput" accept="audio/*" />
      <button id="save">Adicionar</button>
      <button class="secondary" id="cancel">Cancelar</button>
    </div>
  </div>

  <script>
    const dbName = 'musicPlayerDB';
    let db;

    const openDB = () => new Promise((resolve) => {
      const req = indexedDB.open(dbName, 1);
      req.onupgradeneeded = () => {
        db = req.result;
        db.createObjectStore('tabs', { keyPath: 'id', autoIncrement: true });
      };
      req.onsuccess = () => { db = req.result; resolve(); };
    });

    const addTab = (tab) => new Promise((resolve) => {
      const tx = db.transaction('tabs', 'readwrite');
      tx.objectStore('tabs').add(tab);
      tx.oncomplete = resolve;
    });

    const getTabs = () => new Promise((resolve) => {
      const tx = db.transaction('tabs', 'readonly');
      const req = tx.objectStore('tabs').getAll();
      req.onsuccess = () => resolve(req.result);
    });

    const clearTabs = () => new Promise((resolve) => {
      const tx = db.transaction('tabs', 'readwrite');
      tx.objectStore('tabs').clear();
      tx.oncomplete = resolve;
    });

    const grid = document.getElementById('grid');
    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewerImg');
    const viewerTitle = document.getElementById('viewerTitle');
    const player = document.getElementById('player');
    const modal = document.getElementById('modal');

    const addBtn = document.getElementById('add');
    const clearBtn = document.getElementById('clear');
    const closeBtn = document.getElementById('close');
    const cancelBtn = document.getElementById('cancel');
    const saveBtn = document.getElementById('save');

    const titleInput = document.getElementById('titleInput');
    const imgInput = document.getElementById('imgInput');
    const audInput = document.getElementById('audInput');

    async function render() {
      grid.innerHTML = '';
      const tabs = await getTabs();
      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab';
        el.innerHTML = `<img src="${URL.createObjectURL(tab.image)}"><div class="meta"><div class="title">${tab.title}</div></div>`;
        el.onclick = () => openViewer(tab);
        grid.appendChild(el);
      });
    }

    function openViewer(tab) {
      viewerImg.src = URL.createObjectURL(tab.image);
      viewerTitle.textContent = tab.title;
      player.src = URL.createObjectURL(tab.audio);
      viewer.style.display = 'flex';
      player.play();
    }

    addBtn.onclick = () => modal.style.display = 'flex';
    cancelBtn.onclick = () => modal.style.display = 'none';
    closeBtn.onclick = () => { viewer.style.display = 'none'; player.pause(); };

    clearBtn.onclick = async () => {
      if (confirm('Apagar tudo?')) {
        await clearTabs();
        render();
      }
    };

    saveBtn.onclick = async () => {
      const img = imgInput.files[0];
      const aud = audInput.files[0];
      const title = titleInput.value.trim() || 'Sem nome';

      if (!img || !aud) return alert('Selecione imagem e música');

      await addTab({ title, image: img, audio: aud });

      modal.style.display = 'none';
      titleInput.value = '';
      imgInput.value = '';
      audInput.value = '';
      render();
    };

    openDB().then(render);
  </script>
</body>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</html>
